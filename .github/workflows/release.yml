name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release artifacts
        run: ./gradlew build --rerun-tasks --no-configuration-cache --stacktrace

      - name: Verify version and create checksums
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          project_version="$(sed -n 's/^version=//p' gradle.properties)"
          if [[ "${version}" != "${project_version}" ]]; then
            echo "Tag ${tag} does not match gradle.properties version ${project_version}" >&2
            exit 1
          fi
          jar="build/libs/onescreen-${version}.jar"
          sources="build/libs/onescreen-${version}-sources.jar"
          test -f "${jar}"
          test -f "${sources}"
          sha256sum "${jar}" "${sources}" > "build/libs/onescreen-${version}.sha256"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          notes=".github/release-notes/${tag}.md"
          if [[ ! -f "${notes}" ]]; then
            notes="CHANGELOG.md"
          fi
          gh release create "${tag}" \
            "build/libs/onescreen-${version}.jar" \
            "build/libs/onescreen-${version}-sources.jar" \
            "build/libs/onescreen-${version}.sha256" \
            --verify-tag \
            --title "OneScreen ${tag}" \
            --notes-file "${notes}" \
            --latest
